services:
  ipgm-admin-api:
    build: .
    image: ${APP_IMAGE:-ipgm-admin-api}:${APP_TAG:-latest}
    container_name: ipgm-admin-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_CONSUMER_URL: ${DATABASE_CONSUMER_URL}
      DATABASE_MANAGEMENT_URL: ${DATABASE_MANAGEMENT_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      CCAVENUE_MERCHANT_ID: ${CCAVENUE_MERCHANT_ID}
      CCAVENUE_ACCESS_CODE: ${CCAVENUE_ACCESS_CODE}
      CCAVENUE_WORKING_KEY: ${CCAVENUE_WORKING_KEY}
      CCAVENUE_PAYMENT_URL: ${CCAVENUE_PAYMENT_URL}
      CCAVENUE_REDIRECT_URL: ${CCAVENUE_REDIRECT_URL}
      CCAVENUE_CANCEL_URL: ${CCAVENUE_CANCEL_URL}
      ALLOW_TEST_OTP: ${ALLOW_TEST_OTP}
      FORCE_REAL_SMS_IN_DEV: ${FORCE_REAL_SMS_IN_DEV}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_PLACES_DAILY_LIMIT: ${GOOGLE_PLACES_DAILY_LIMIT}
      WEB_AUTH_JWT_SECRET: ${WEB_AUTH_JWT_SECRET}
      WEB_AUTH_JWT_EXPIRES_IN: ${WEB_AUTH_JWT_EXPIRES_IN}
      WEB_AUTH_REFRESH_SECRET: ${WEB_AUTH_REFRESH_SECRET}
      WEB_AUTH_REFRESH_DAYS: ${WEB_AUTH_REFRESH_DAYS}
      WEB_AUTH_OTP_EXPIRY_MINUTES: ${WEB_AUTH_OTP_EXPIRY_MINUTES}
      WEB_AUTH_OTP_LENGTH: ${WEB_AUTH_OTP_LENGTH}
      WEB_AUTH_OTP_MAX_ATTEMPTS: ${WEB_AUTH_OTP_MAX_ATTEMPTS}
      WEB_AUTH_OTP_SECRET: ${WEB_AUTH_OTP_SECRET}
    expose:
      - "3000"

networks:
  default:
    external: true
    name: ipgm-admin-api-network
